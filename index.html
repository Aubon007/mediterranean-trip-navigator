function render(input,list,items,onPick){ const q=input.value.trim().toLowerCase(); const matches=items.filter(x=>(x.name+x.zh+x.city).toLowerCase().includes(q)); list.innerHTML=''; matches.forEach(x=>{const el=document.createElement('div');el.className='option';el.tabIndex=0;el.innerHTML='<strong>'+x.name+'</strong><span>'+x.zh+' Â· '+x.city+'</span>';el.onclick=()=>onPick(x);el.onkeydown=e=>{if(e.key==='Enter')onPick(x)};list.append(el)}); list.hidden=!matches.length; input.setAttribute('aria-expanded',String(!list.hidden)); }
function chooseOrigin(x){chosenOrigin=x;origin.value=x.name;document.querySelector('#originList').hidden=true} function chooseDestination(x){chosenDestination=x;destination.value=x.name;document.querySelector('#destinationList').hidden=true;document.querySelector('#placeName').textContent=x.name;document.querySelector('#placeDesc').textContent=x.zh;document.querySelector('#placeCard').hidden=false}
function originItems(){const saved=(showAllOrigins || isUtilityMode()) ? data : data.filter(x=>x.group===currentGroup());return [{current:true,name:'ðŸ“ Current Location',zh:'ä½¿ç”¨æ‰‹æ©Ÿç›®å‰ä½ç½®',city:'GPS'},...saved]};
origin.value=chosenOrigin.name; origin.addEventListener('input',()=>{chosenOrigin=null; render(origin,document.querySelector('#originList'),originItems(),chooseOrigin)}); origin.addEventListener('focus',()=>render(origin,document.querySelector('#originList'),originItems(),chooseOrigin));
function destItems(){return isUtilityMode() ? utilityCategories : (showAllDestinations ? data : data.filter(x=>x.group===currentGroup()))}; destination.addEventListener('input',()=>{chosenDestination=null; render(destination,document.querySelector('#destinationList'),destItems(),chooseDestination)}); destination.addEventListener('focus',()=>render(destination,document.querySelector('#destinationList'),destItems(),chooseDestination));
document.querySelector('#originAll').onclick=()=>{showAllOrigins=!showAllOrigins;const button=document.querySelector('#originAll');button.setAttribute('aria-pressed',showAllOrigins);origin.blur();render(origin,document.querySelector('#originList'),originItems(),chooseOrigin)};
document.querySelector('#destinationAll').onclick=()=>{const button=document.querySelector('#destinationAll');if(isUtilityMode()){showAllDestinations=false;button.setAttribute('aria-pressed','false');document.querySelector('#destinationHint').textContent='Utility categories near your origin';destination.blur();render(destination,document.querySelector('#destinationList'),destItems(),chooseDestination);return}showAllDestinations=!showAllDestinations;button.setAttribute('aria-pressed',showAllDestinations);document.querySelector('#destinationHint').textContent=showAllDestinations?'All saved locations':'Places for '+currentLocation();destination.blur();render(destination,document.querySelector('#destinationList'),destItems(),chooseDestination)};
const originArrow=document.querySelector('#originArrow'), destinationArrow=document.querySelector('#destinationArrow');
[originArrow,destinationArrow].forEach(button=>button.addEventListener('pointerdown',event=>event.preventDefault()));
originArrow.onclick=()=>{const list=document.querySelector('#originList');chosenOrigin=null;origin.value='';origin.blur();if(!list.hidden){list.hidden=true;origin.setAttribute('aria-expanded','false');return}render(origin,list,originItems(),chooseOrigin)};

[originClear,destinationClear].forEach(button=>button.addEventListener('pointerdown',event=>event.preventDefault()));

function resetForDate(){if(document.activeElement && document.activeElement.blur)document.activeElement.blur();closeDayList();chosenOrigin=isUtilityMode()?{current:true,name:'ðŸ“ Current Location',zh:'ä½¿ç”¨æ‰‹æ©Ÿç›®å‰ä½ç½®',city:'GPS'}:null;origin.value=chosenOrigin?chosenOrigin.name:'';chosenDestination=null;destination.value='';showAllOrigins=false;showAllDestinations=false;document.querySelector('#originAll').setAttribute('aria-pressed','false');document.querySelector('#destinationAll').setAttribute('aria-pressed','false');document.querySelector('#placeCard').hidden=true;document.querySelectorAll('.suggestions').forEach(x=>x.hidden=true);origin.setAttribute('aria-expanded','false');destination.setAttribute('aria-expanded','false');status.textContent=isUtilityMode()?'Utility selected. Choose a nearby service category.':'Origin and destination cleared for the new date.';document.querySelector('#destinationHint').textContent=isUtilityMode()?'Utility categories near your origin':'Places for '+currentLocation();destination.placeholder=isUtilityMode()?'Search utility categories':'Search places for this date';requestAnimationFrame(()=>document.querySelector('#dateControl').scrollIntoView({behavior:'smooth',block:'start'}));}

document.querySelector('#swap').onclick=()=>{if(isUtilityMode()){status.textContent='Utility uses an origin plus a service category.';return}if(!chosenDestination){status.textContent='Choose a destination first, then swap.';return} const oldOrigin=chosenOrigin; chooseOrigin(chosenDestination); if(oldOrigin && !oldOrigin.current) chooseDestination(oldOrigin); else {chosenDestination=null;destination.value='';document.querySelector('#placeCard').hidden=true;} status.textContent='Origin and destination swapped.'};
document.addEventListener('click',e=>{if(!e.target.closest('.control')){document.querySelectorAll('.suggestions').forEach(x=>x.hidden=true);day.setAttribute('aria-expanded','false')}});
document.querySelector('#go').onclick=()=>{const dest=chosenDestination?chosenDestination.query:destination.value.trim(); if(!dest){status.textContent='Please enter or select a destination.'; destination.focus();return} const mode=document.querySelector('#transport').value; const open=(start)=>{let url;if(isUtilityMode()){const near=(start==='Current Location')?'near me':'near '+start;url='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(dest+' '+near);status.textContent='Opening nearby results in Google Mapsâ€¦'}else{url='https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(start)+'&destination='+encodeURIComponent(dest); if(mode)url+='&travelmode='+encodeURIComponent(mode); status.textContent='Opening Google Maps directionsâ€¦'} window.location.assign(url);}; const typedOrigin=origin.value.trim(); if(chosenOrigin && chosenOrigin.current){if(navigator.geolocation){status.textContent='Getting current locationâ€¦'; navigator.geolocation.getCurrentPosition(p=>open(p.coords.latitude+','+p.coords.longitude),()=>open('Current Location'),{enableHighAccuracy:true,timeout:7000,maximumAge:60000});}else open('Current Location')} else if(chosenOrigin)open(chosenOrigin.query); else if(typedOrigin)open(typedOrigin); else {status.textContent='Please enter or select an origin.';origin.focus();}};
document.querySelector('#destinationHint').textContent=isUtilityMode()?'Utility categories near your origin':'Places for '+currentLocation();
